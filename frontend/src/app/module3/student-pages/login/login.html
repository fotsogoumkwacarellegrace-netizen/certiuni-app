<div class="login-page"><div class="login-card"><div class="top-bar"><a routerLink="/public/landing"><img src="assets/logos/logo.png" alt="CertiUni" class="top-bar-logo"></a><div class="top-bar-divider"></div><div class="top-bar-text"><span class="top-bar-title">Session Étudiant</span><span class="top-bar-subtitle">Accédez à vos diplômes</span></div><div class="top-bar-actions"><app-back-button></app-back-button><app-theme-toggle></app-theme-toggle></div><mat-icon class="cap-icon">school</mat-icon></div><div class="card-body"><img src="assets/logos/logo.png" alt="CertiUni" class="main-logo"><h1>Connexion étudiant</h1><div class="title-underline"></div><p class="subtitle">Connectez-vous avec votre email ou votre matricule.</p><form [formGroup]="form" (ngSubmit)="onSubmit()"><label for="identifiant">Email ou matricule *</label><div class="input-wrapper"><mat-icon class="icon">person</mat-icon><input id="identifiant" type="text" formControlName="identifiant" placeholder="Email ou matricule"></div><label for="motDePasse">Mot de passe *</label><div class="input-wrapper"><mat-icon class="icon">lock</mat-icon><input id="motDePasse" [type]="showPassword()?'text':'password'" formControlName="motDePasse" placeholder="Votre mot de passe"><button type="button" (click)="showPassword.set(!showPassword())"><mat-icon>{{showPassword()?'visibility_off':'visibility'}}</mat-icon></button></div>@if(errorMessage()){<p class="error-message">{{errorMessage()}}</p>}<button type="submit" class="btn-primary"><mat-icon class="btn-icon">login</mat-icon> Se connecter</button></form><p class="subtitle" style="margin-top:18px;margin-bottom:8px">Pas encore de compte ? <a routerLink="/student/register">Créer un compte</a></p>@if(demoEnabled){<div class="demo-separator"><span>Ou</span></div><button type="button" class="btn-demo" (click)="loginWithDemo()" [disabled]="isDemoLoading()"><mat-icon class="btn-icon">person</mat-icon>{{isDemoLoading()?'Connexion…':'Compte étudiant de démonstration'}}</button>}</div></div></div>
