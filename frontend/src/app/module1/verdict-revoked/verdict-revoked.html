<div class="verdict-container">

  <!-- HEADER -->
  <header class="verdict-header">
    <div class="logo-container">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2">
        <polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9"/>
      </svg>
      <span class="logo-text">CertiUni</span>
    </div>
  </header>

  <div class="verdict-body">
    <button class="back-link" (click)="onBackToHome()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      Retour à l'accueil
    </button>

    <!-- BANNIÈRE ROUGE -->
    <div class="danger-banner">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
      <div class="banner-text">
        ATTENTION : CE DOCUMENT A ÉTÉ<br>
        OFFICIELLEMENT ANNULÉ PAR<br>
        L'UNIVERSITÉ
      </div>
    </div>

    <!-- CARTE FLOUTÉE -->
    <div class="revoked-card">
      <div class="revoked-card-header">
        <div class="institution-info">
          <div class="institution-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="1.5">
              <path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>
            </svg>
          </div>
          <div class="institution-text blurred">
            <p class="institution-name">Université Virtuelle de Yaoundé</p>
            <p class="course-name">Master en Cybersécurité et Réseaux</p>
            <p class="doc-id">ID: DOC-2023-998-KEY</p>
          </div>
        </div>
        <div class="banned-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#EF4444" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/>
          </svg>
        </div>
      </div>

      <div class="revoked-card-body blurred">
        <p class="student-name-blur">{{ studentName() }}</p>
        <div class="fake-lines">
          <span></span><span></span><span></span>
        </div>
      </div>

      <div class="reason-box">
        <p>{{ revocationReason() }}</p>
      </div>
    </div>

    <button class="contact-btn" (click)="onContactSecretariat()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
        <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
        <polyline points="22 6 12 13 2 6"/>
      </svg>
      Contacter le Secrétariat Émetteur
    </button>
  </div>
</div>
