<div class="backdrop" (click)="onBackdropClick($event)">
  <div class="momo-card">
    <div class="card-top-border"></div>

    <div class="card-content">
      <div class="shield-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
          <path d="M12 2l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V5z"/>
        </svg>
      </div>

      <h2 class="card-title">Sécurisation de la Requête Manuelle</h2>
      <p class="card-amount">
        Montant fixe de facturation d'audit : <strong>{{ auditAmount | number:'1.0-0':'fr' }} FCFA</strong>
      </p>

      @if (!requestSent()) {
        <div class="form-section">
          <label class="phone-label">Numéro de téléphone Mobile Money</label>

          <div class="phone-input-wrapper">
            <span class="country-code">CM +237</span>
            <input
              type="tel"
              placeholder="6XX XX XX XX"
              [(ngModel)]="phoneNumber"
              maxlength="9"
              [disabled]="isProcessing()"
            />
          </div>

          <div class="encryption-badge">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Transaction chiffrée de bout en bout
          </div>

          <div class="operator-select">
            <button
              class="operator-btn mtn"
              [class.selected]="selectedOperator() === 'MTN'"
              (click)="selectOperator('MTN')"
            >
              MTN Mobile Money
            </button>
            <button
              class="operator-btn orange"
              [class.selected]="selectedOperator() === 'ORANGE'"
              (click)="selectOperator('ORANGE')"
            >
              Orange Money
            </button>
          </div>

          <button
            class="submit-btn"
            (click)="onSubmit()"
            [disabled]="isProcessing() || phoneNumber().length < 9 || !selectedOperator()"
          >
            {{ isProcessing() ? 'Envoi en cours...' : 'Confirmer la demande' }}
          </button>

          <button class="cancel-btn" (click)="onClose()">Annuler</button>
        </div>
      } @else {
        <div class="success-state">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2">
            <circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>
          </svg>
          <p>Demande enregistrée</p>
          <span>Notre équipe vous contactera sous 48 heures.</span>
        </div>
      }
    </div>
  </div>
</div>
