<!-- frontend/src/app/module3-admin/mon-institution/changer-logo/changer-logo.html -->
<div class="settings-page" [class.dark-mode]="isDarkMode()">

  <!-- HEADER -->
  <header class="settings-header">
    <div class="header-inner">
      <div class="brand" (click)="back()">
        <img src="images/logo.png" alt="CertiUni" class="brand-logo" />
        <span class="brand-text">CertiUni</span>
      </div>

      <div class="header-actions">
        <button class="btn-back" (click)="back()">
          <span class="material-symbols-outlined">arrow_back</span>
          <span>Retour</span>
        </button>
        <button class="theme-toggle" (click)="toggleDarkMode()" aria-label="Changer le theme">
          <span class="material-symbols-outlined">
            {{ isDarkMode() ? 'light_mode' : 'dark_mode' }}
          </span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="settings-main">

    <div class="settings-title">
      <span class="material-symbols-outlined">image</span>
      <h1>Changer le logo</h1>
    </div>
    <p class="settings-subtitle">Importez le nouveau logo officiel de votre institution</p>

    <div class="settings-grid">

      <!-- CONTENT -->
      <div class="settings-content">
        <div class="settings-card">

          <!-- Apercu -->
          <div class="logo-preview">
            <img
              [src]="logoPreview() || 'images/logo.png'"
              alt="Apercu du logo"
              style="height:80px; width:auto; border-radius:10px;"
            />
            <div>
              <div style="font-size:1.2rem; font-weight:800; color:var(--primary);">Apercu</div>
              <div style="font-size:0.82rem; color:var(--text-secondary);">
                {{ fileName() || 'Aucun fichier selectionne (logo actuel affiche)' }}
              </div>
            </div>
          </div>

          <form class="logo-form" (ngSubmit)="envoyer()">
            <div class="form-row">
              <div class="form-group">
                <label for="logo">Fichier logo (.png, .jpg, .svg)</label>
                <input id="logo" type="file" accept=".png,.jpg,.jpeg,.svg" (change)="onFileSelected($event)">
              </div>
            </div>

            <div class="form-actions">
              <button type="button" class="btn-cancel" (click)="back()">Annuler</button>
              <button type="submit" class="btn-save" [disabled]="uploading()">
                <span *ngIf="uploading()" class="material-symbols-outlined">hourglass_empty</span>
                <span>{{ uploading() ? 'Envoi...' : 'Enregistrer le logo' }}</span>
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>

  </main>

</div>
