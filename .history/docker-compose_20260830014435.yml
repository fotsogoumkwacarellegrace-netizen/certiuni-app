version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. Service Base de données PostgreSQL
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: certiuni-postgres
    restart: always
    environment:
      POSTGRES_USER: certiuni_user
      POSTGRES_PASSWORD: certiuni_password_2026
      POSTGRES_DB: certiuni_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U certiuni_user -d certiuni_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # 2. Service Backend Express (TypeScript)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: certiuni-backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: "postgresql://certiuni_user:certiuni_password_2026@postgres:5432/certiuni_db?schema=public"
      JWT_SECRET: "super_secret_certiuni_key_2026_prod"
      FRONTEND_URL: "http://localhost:5173"
      PUBLIC_VERIFY_URL: "http://localhost:5173/verify"
    depends_on:
      postgres:
        condition: service_healthy

# -------------------------------------------------------------
# Volumes persistants
# -------------------------------------------------------------
volumes:
  postgres_data:
    driver: local