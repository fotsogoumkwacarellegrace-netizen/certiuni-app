name: Backend CI/CD

on:
  push:
    branches: [main, dev, dev-standing]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, dev, dev-standing]
    paths:
      - 'backend/**'

env:
  NODE_VERSION: 20
  PACKAGE_DIR: backend

jobs:
  # ============================================================
  # 1. Lint & Static Analysis
  # ============================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx eslint "src/**/*.ts" "tests/**/*.ts" --max-warnings=0
      - run: npx prettier --check "src/**/*.ts" "tests/**/*.ts"

  # ============================================================
  # 2. Type Check
  # ============================================================
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json

  # ============================================================
  # 3. Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
      - name: Run Snyk Security Scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN || '' }}
        with:
          args: --severity-threshold=medium --fail-on=all
        continue-on-error: true

  # ============================================================
  # 4. Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certiuni_user
          POSTGRES_PASSWORD: certiuni_password_2026
          POSTGRES_DB: certiuni_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U certiuni_user -d certiuni_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://certiuni_user:certiuni_password_2026@localhost:5432/certiuni_test
      - run: npm run test:cov
        env:
          DATABASE_URL: postgresql://certiuni_user:certiuni_password_2026@localhost:5432/certiuni_test
          NODE_ENV: test
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella

  # ============================================================
  # 5. E2E Integration Tests
  # ============================================================
  e2e-tests:
    name: E2E Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certiuni_user
          POSTGRES_PASSWORD: certiuni_password_2026
          POSTGRES_DB: certiuni_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U certiuni_user -d certiuni_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://certiuni_user:certiuni_password_2026@localhost:5432/certiuni_e2e
      - run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://certiuni_user:certiuni_password_2026@localhost:5432/certiuni_e2e
          NODE_ENV: test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: test/
          retention-days: 14

  # ============================================================
  # 6. Build & Docker
  # ============================================================
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.PACKAGE_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME || 'docker' }}
          password: ${{ secrets.DOCKER_PASSWORD || '' }}
        continue-on-error: true
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: certiuni/backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
